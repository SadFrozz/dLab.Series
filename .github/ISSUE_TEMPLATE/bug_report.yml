name: Bug report
description: Report a reproducible problem with dLab plugins.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, CPU architecture, host/version and dLab version.
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio setup
      description: Model, VST2/VST3/AU, sample rate, buffer size and oversampling.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include expected and actual behavior. Share private audio only with permission.
    validations:
      required: true
