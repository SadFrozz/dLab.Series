name: Build dLab.Series
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: cmake --preset windows-x64
      - run: cmake --build --preset windows-x64
      - run: ctest --preset windows-x64
      - run: cmake --build build/windows-x64 --config Release --target dLab_Series_Package
      - name: Build NSIS installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          path: build/windows-x64/dLab.Series-Windows-x64-Setup.exe
          archive: false
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: cmake --preset macos-universal
      - run: cmake --build --preset macos-universal
      - run: ctest --preset macos-universal
      - run: cmake --build build/macos-universal --target dLab_Series_Package
      - name: Build macOS installer
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          path: build/macos-universal/dLab.Series-macOS-Universal.pkg
          archive: false
          if-no-files-found: error
  release:
    name: Publish tagged release
    needs: [windows, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: dLab.Series-*
          merge-multiple: true
          path: release-assets
      - name: Prepare release notes and verify assets
        id: notes
        run: python scripts/release-notes.py "$RELEASE_TAG" --assets release-assets
      - name: Publish GitHub release
        env:
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi
